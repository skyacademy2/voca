<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOCA 통합 - 10개=1세트(연속)</title>
  <style>
    :root { --primary:#2563eb; --success:#16a34a; --error:#dc2626; --bg:#f8fafc; }
    * { box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      display:flex; flex-direction:column; align-items:center;
      padding:12px; margin:0; color:#0f172a;
    }
    header {
      width:100%; max-width:900px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:14px; gap:10px;
    }
    h2 { margin:0; font-size:20px; font-weight:900; }
    .reset-btn {
      padding:8px 10px; background:#e2e8f0; border:none; border-radius:8px;
      cursor:pointer; font-size:11px; font-weight:900; margin-right:6px;
    }
    #reviewBtn { background:#fee2e2; color:#dc2626; }
    .nav-container { display:flex; align-items:center; gap:10px; }
    select {
      padding:10px 12px; border-radius:10px; border:1px solid #cbd5e1;
      font-weight:900; cursor:pointer; background:white; font-size:15px;
    }
    .container {
      background:white; padding:20px; border-radius:18px;
      box-shadow:0 10px 25px rgba(0,0,0,0.06);
      width:100%; max-width:900px; text-align:center;
      display:flex; flex-direction:column; justify-content:space-between; gap:14px;
    }
    .hidden { display:none !important; }
    .word-list {
      text-align:left; margin-bottom:10px; border-top:2px solid #f1f5f9;
      max-height:55vh; overflow-y:auto; width:100%;
    }
    .word-item {
      display:flex; justify-content:space-between; gap:12px; padding:12px;
      border-bottom:1px solid #f1f5f9;
    }
    .word-item span:first-child { font-weight:900; color:var(--primary); font-size:1.15rem; word-break:break-word; }
    .word-item span:last-child { color:#475569; font-weight:800; text-align:right; font-size:1.0rem; word-break:break-word; }
    .quiz-header {
      display:flex; justify-content:space-between; color:#64748b; font-weight:900; font-size:14px;
    }
    .quiz-word {
      font-size: clamp(30px, 8vw, 44px);
      font-weight:900; margin:10px 0 14px 0; color:#0f172a;
      word-break:break-word; line-height:1.1;
    }
    .options-grid { display:flex; flex-direction:column; gap:10px; }
    .option-btn {
      padding:16px; border:2px solid #e2e8f0; border-radius:14px;
      background:white; cursor:pointer; font-size:17px; font-weight:900;
      transition:0.2s; text-align:left; line-height:1.25;
    }
    .option-btn.correct { background:var(--success) !important; color:white; border-color:var(--success); }
    .option-btn.wrong { background:var(--error) !important; color:white; border-color:var(--error); }
    .spell-input {
      width:100%; padding:16px; border:3px solid #cbd5e1; border-radius:14px;
      font-size:22px; text-align:center; font-weight:900; outline:none; transition:0.3s;
    }
    .spell-input:focus { border-color:var(--primary); }
    .spell-hint {
      font-size:22px; font-weight:900; color:var(--primary);
      letter-spacing:3px; margin:0 0 12px 0; word-break:break-word;
    }
    .spell-hint .hint-label { font-size:13px; color:#64748b; letter-spacing:0; margin-right:8px; }
    .spell-input.correct { border-color:var(--success); background:#f0fdf4; }
    .spell-input.wrong { border-color:var(--error); background:#fef2f2; }
    .main-btn {
      width:100%; padding:15px; background:var(--primary); color:white; border:none;
      border-radius:14px; font-size:18px; font-weight:900; cursor:pointer;
    }
    .next-btn { background:#334155; margin-top:6px; }
    .praise { font-size:18px; font-weight:900; color:var(--success); min-height:28px; margin:10px 0 0 0; }
    .review-badge { font-size:11px; background:#fee2e2; color:#ef4444; padding:2px 6px; border-radius:6px; margin-left:6px; font-weight:900; }
    @media (max-width: 520px) {
      header { flex-direction:column; align-items:flex-start; margin-bottom:10px; }
      .nav-container { width:100%; justify-content:space-between; }
      select { width:190px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h2>VOCA 통합 (10개=1세트)</h2>
      <button class="reset-btn" id="reviewBtn" onclick="openReviewQuiz()">오답노트 복습</button>
      <button class="reset-btn" onclick="resetAllData()">학습 기록 초기화</button>
    </div>
    <div class="nav-container">
      <span style="font-size:14px; font-weight:900;">세트:</span>
      <select id="setNav" onchange="changeSet(this.value)"></select>
    </div>
  </header>

  <div id="studyView" class="container">
    <div>
      <h3 id="studyTitle">Set 1 학습 리스트</h3>
      <p style="font-size:13px; color:#64748b; margin:0 0 10px 0;">암기 후 [문제 시작하기]를 눌러주세요.</p>
      <div class="word-list" id="wordListContainer"></div>
    </div>
    <button class="main-btn" onclick="startQuiz()">문제 시작하기</button>
  </div>

  <div id="quizView" class="container hidden">
    <div>
      <div class="quiz-header">
        <span id="quizMode">객관식</span>
        <span id="progress">1 / 20</span>
      </div>
      <div class="quiz-word" id="targetWord">word</div>
      <div class="options-grid" id="optionsContainer"></div>
      <div id="spellContainer" class="hidden">
        <div class="spell-hint" id="spellHint"></div>
        <input type="text" id="spellInput" class="spell-input" placeholder="한국어 뜻을 입력하세요 (여러 뜻 중 하나만)" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitSpelling();" />
        <button class="main-btn" id="spellSubmitBtn" style="margin-top:10px;" onclick="submitSpelling()">확인</button>
      </div>
      <div id="quizFeedback" class="praise"></div>
    </div>
    <button id="nextQuestionBtn" class="main-btn next-btn hidden" onclick="goNext()">다음 문제로</button>
  </div>

  <div id="resultView" class="container hidden">
    <div id="resultContent" style="margin-top:60px;"></div>
    <div>
      <button id="primaryResultBtn" class="main-btn" onclick="initStudy()">다시 학습</button>
      <button id="nextSetBtn" class="main-btn" style="background:#64748b; margin-top:10px; opacity:0.4;" onclick="moveToNextSet()" disabled>다음 세트로</button>
    </div>
  </div>

    const safeStorage = (function () {
      try {
        const t = '__voca_test__';
        window.localStorage.setItem(t, '1');
        window.localStorage.removeItem(t);
        return window.localStorage;
      } catch (e) {
        const mem = {};
        return {
          getItem: k => (k in mem ? mem[k] : null),
          setItem: (k, v) => { mem[k] = String(v); },
          removeItem: k => { delete mem[k]; }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function normalizeKoreanMeaning(s) {
      return (s || '').replace(/\s+/g, ' ').trim();
    }

    function buildSynonymMap() {
      const byMeaning = {};
      vocabulary.forEach(w => {
        const key = normalizeKoreanMeaning(w.k);
        if (!byMeaning[key]) byMeaning[key] = [];
        if (!byMeaning[key].includes(w.e)) byMeaning[key].push(w.e);
      });
      const map = {};
      vocabulary.forEach(w => {
        const key = normalizeKoreanMeaning(w.k);
        map[w.e] = byMeaning[key].filter(e => e !== w.e);
      });
      return map;
    }

    // ---------- 주관식(한국어 뜻 쓰기) 초성 힌트 ----------
    // 뜻이 여러 개면(쉼표 구분) 첫 번째 뜻 기준으로,
    // 첫 음절의 초성만 보여주고 나머지 글자는 ○ 처리
    // 예) "동행하다, 동반하다" -> "ㄷ○○○" / "지인, 알고 지냄" -> "ㅈ○"
    const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

    function getChosung(ch) {
      const code = ch.charCodeAt(0) - 0xAC00;
      if (code < 0 || code > 11171) return ch; // 한글 음절이 아니면 그대로
      return CHOSUNG[Math.floor(code / 588)];
    }

    function splitMeanings(k) {
      return String(k).split(/[,·\/]/).map(s => s.trim()).filter(Boolean);
    }

    function buildSpellHint(k) {
      const first = splitMeanings(k)[0] || '';
      let out = '';
      let revealed = false;
      for (const ch of first) {
        if (ch === ' ') { out += ' '; continue; }
        if (!revealed) { out += getChosung(ch); revealed = true; }
        else out += '○';
      }
      return out;
    }

    // ---------- 퍼지(오타 허용) 스펠링 매칭 ----------
    function normalizeSpell(s) {
      return (s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    function isFuzzyMatch(input, target) {
      const a = normalizeSpell(input);
      const b = normalizeSpell(target);
      if (!a) return false;
      if (a === b) return true;
      const dist = levenshtein(a, b);
      const threshold = b.length <= 4 ? 1 : (b.length <= 8 ? 2 : 3);
      return dist <= threshold;
    }

    function normalizeKo(s) {
      return (s || '').replace(/\s+/g, ' ').trim();
    }

    function gradeKoreanMeaning(input, target) {
      const val = normalizeKo(input);
      if (!val) return { ok: false, matchType: null, matched: null };
      const candidates = splitMeanings(target.k);
      for (const c of candidates) {
        const cand = normalizeKo(c);
        if (val === cand) return { ok: true, matchType: 'exact', matched: cand };
        if (val + '하다' === cand || val === cand + '하다') {
          return { ok: true, matchType: 'loose', matched: cand };
        }
        if (cand.length >= 3 && levenshtein(val, cand) <= 1) {
          return { ok: true, matchType: 'typo', matched: cand };
        }
      }
      return { ok: false, matchType: null, matched: null };
    }

    // 정답 또는 유의어(같은 뜻의 다른 단어)를 입력해도 정답으로 인정
    // 반환값: { ok, matchType: 'exact'|'typo'|'synonym', matchedWord }
    function gradeSpelling(input, target) {
      if (isFuzzyMatch(input, target.e)) {
        const exact = normalizeSpell(input) === normalizeSpell(target.e);
        return { ok: true, matchType: exact ? 'exact' : 'typo', matchedWord: target.e };
      }
      const syns = synonymMap[target.e] || [];
      for (const s of syns) {
        if (isFuzzyMatch(input, s)) {
          return { ok: true, matchType: 'synonym', matchedWord: s };
        }
      }
      return { ok: false, matchType: null, matchedWord: null };
    }

    // ---------- 오답노트(누적) 관리 ----------
    function recordWrong(item) {
      const key = item.e;
      wrongLog[key] = {
        e: item.e,
        k: item.k,
        count: wrongLog[key] ? wrongLog[key].count + 1 : 1
      };
      saveToLocal();
      updateReviewBtnLabel();
    }

    function clearWrongIfPresent(item) {
      if (wrongLog[item.e]) {
        delete wrongLog[item.e];
        saveToLocal();
        updateReviewBtnLabel();
      }
    }

    function updateReviewBtnLabel() {
      const btn = document.getElementById('reviewBtn');
      if (!btn) return;
      const count = Object.keys(wrongLog).length;
      btn.innerText = count > 0 ? `오답노트 복습 (${count})` : '오답노트 복습';
    }

    // ---------- 세트별 '완전 통과' 판정 (객관식+주관식+오답복습 전부 포함) ----------
    function pendingWrongCountForSet(setIdx) {
      const start = setIdx * SET_SIZE;
      const end = Math.min(start + SET_SIZE, vocabulary.length);
      let cnt = 0;
      for (let i = start; i < end; i++) {
        if (wrongLog[vocabulary[i].e]) cnt++;
      }
      return cnt;
    }

    // 그 세트를 최소 1회 도전했고, 주관식 80점 이상 통과했으며,
    // 남아있는 오답(객관식/주관식 통틀어)이 하나도 없으면 '완전 클리어'
    // ★ 한 번 클리어한 세트는 영구 기록(setCleared)되어,
    //   이후 상위 세트의 '누적 복습'에서 이 세트 단어를 틀리더라도 다시 잠기지 않음
    function isSetCleared(setIdx) {
      if (setCleared[setIdx]) return true;
      const ok = !!setAttempted[setIdx] && !!setSpellPass[setIdx] && pendingWrongCountForSet(setIdx) === 0;
      if (ok) {
        setCleared[setIdx] = true;
        saveToLocal();
      }
      return ok;
    }

    function saveToLocal() {
      const data = { currentSetIdx, setWrongCounts, setAttempted, wrongLog, setSpellPass, setCleared };
      safeStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadFromLocal() {
      const saved = safeStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        currentSetIdx = parsed.currentSetIdx ?? 0;
        setWrongCounts = parsed.setWrongCounts ?? {};
        setAttempted = parsed.setAttempted ?? {};
        wrongLog = parsed.wrongLog ?? {};
        setSpellPass = parsed.setSpellPass ?? {};
        setCleared = parsed.setCleared ?? {};

        // [마이그레이션] 예전 버전에서 이미 완료했던 세트(도전O + 남은오답 0)는
        // 주관식 통과로 간주하여 다시 잠기지 않게 함
        if (parsed.setSpellPass === undefined) {
          Object.keys(setAttempted).forEach(idxStr => {
            const idx = parseInt(idxStr, 10);
            if (setAttempted[idx] && pendingWrongCountForSet(idx) === 0) {
              setSpellPass[idx] = true;
            }
          });
        }

        // [마이그레이션2] setCleared가 없던 예전 데이터 복구
        // - 뒤 세트를 도전한 기록이 있다면, 그 앞 세트는 과거에 이미 완전 클리어했던 것이므로 영구 클리어 처리
        //   (누적 복습 오답 때문에 뒤로 밀려버린 데이터를 원상 복구)
        if (parsed.setCleared === undefined) {
          const ts = totalSets();
          let lastAttempted = -1;
          for (let i = 0; i < ts; i++) {
            if (setAttempted[i]) lastAttempted = i;
          }
          for (let i = 0; i < ts; i++) {
            const provenByProgress = !!setSpellPass[i] && i < lastAttempted; // 뒤 세트 도전 = 이 세트는 이미 클리어했었음
            const normallyCleared = !!setAttempted[i] && !!setSpellPass[i] && pendingWrongCountForSet(i) === 0;
            if (provenByProgress || normallyCleared) setCleared[i] = true;
          }
          // 잠금 버그로 뒤 세트에서 앞 세트로 밀려난 경우, 실제 진행 위치로 복원
          let unlocked = 0;
          for (let i = 0; i < ts; i++) {
            if (setCleared[i]) unlocked = i + 1;
            else break;
          }
          const restoreIdx = Math.min(unlocked, ts - 1);
          if (currentSetIdx < restoreIdx) currentSetIdx = restoreIdx;
          saveToLocal();
        }
      } catch (e) {
        // ignore
      }
    }

    function resetAllData() {
      if (confirm("모든 학습 기록을 초기화할까요? (오답노트 포함)")) {
        safeStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }

    function totalSets() {
      return Math.ceil(vocabulary.length / SET_SIZE);
    }

    // 현재까지 '완전 클리어'(객관식+주관식+오답복습까지 전부 통과)로 잠금 해제된 최대 세트 인덱스(0부터)
    // - Set 1(인덱스 0)의 오답이 0개가 되어야 Set 2(인덱스 1)로 이동 가능
    // - 중간에 하나라도 미해결 오답이 있으면 그 다음 세트부터는 잠김
    function maxUnlockedSetIdx() {
      const ts = totalSets();
      let unlocked = 0;
      for (let i = 0; i < ts; i++) {
        if (isSetCleared(i)) unlocked = i + 1;
        else break;
      }
      // unlocked는 '열려있는 세트 개수'이므로, 최대 인덱스는 unlocked(다음 세트)까지 허용
      // 예: Set1 완료(unlocked=1)면 Set2(인덱스1)까지 접근 허용
      return Math.min(unlocked, ts - 1);
    }
    function updateSetNav() {
      const nav = document.getElementById('setNav');
      nav.innerHTML = '';
      const ts = totalSets();
      const unlockedMax = maxUnlockedSetIdx();

      // 현재 세트가 잠금 범위를 벗어나면(데이터가 꼬였거나 직접 수정 등) 자동으로 되돌림
      if (currentSetIdx > unlockedMax) {
        currentSetIdx = unlockedMax;
        saveToLocal();
      }

      for (let i = 0; i < ts; i++) {
        const opt = document.createElement('option');
        opt.value = i;

        const isLocked = (i > unlockedMax);
        let label = `Set ${i + 1}`;
        if (isLocked) label += ' 🔒';
        if (setAttempted[i]) {
          if (isSetCleared(i)) {
            label += ` (완료✅)`;
          } else {
            const pending = pendingWrongCountForSet(i);
            label += pending > 0 ? ` (남은오답: ${pending})` : ` (완료✅)`;
          }
        }

        opt.innerText = label;
        opt.disabled = isLocked;
        opt.selected = (i === currentSetIdx);
        nav.appendChild(opt);
      }

      // UI 값도 확실히 동기화
      nav.value = String(currentSetIdx);
    }

    function changeSet(val) {
      const targetIdx = parseInt(val, 10);
      const unlockedMax = maxUnlockedSetIdx();

      if (targetIdx > unlockedMax) {
        alert('이전 세트에서 주관식 80점 이상을 받고, 오답(객관식·주관식 모두)을 하나도 남김없이 해결해야 다음 세트로 넘어갈 수 있어요.');
        // 선택을 원래 세트로 되돌림
        const nav = document.getElementById('setNav');
        nav.value = String(currentSetIdx);
        return;
      }

      currentSetIdx = targetIdx;
      saveToLocal();
      initStudy();
    }

    function showOnly(viewId) {
      document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
    }

    function initStudy() {
      showOnly('studyView');
      updateSetNav();
      document.getElementById('studyTitle').innerText = `Set ${currentSetIdx + 1} 학습 리스트`;
      const container = document.getElementById('wordListContainer');
      container.innerHTML = '';
      const start = currentSetIdx * SET_SIZE;
      const currentWords = vocabulary.slice(start, start + SET_SIZE);
      currentWords.forEach(w => {
        container.innerHTML += `<div class="word-item"><span>${w.e}</span><span>${w.k}</span></div>`;
      });
    }

    function startQuiz() {
      const start = currentSetIdx * SET_SIZE;
      const currentWords = vocabulary.slice(start, start + SET_SIZE);

      if (currentWords.length === 0) return;

      quizMode = 'normal';

      if (currentSetIdx === 0) {
        roundWords = currentWords;
      } else {
        const previousWords = vocabulary.slice(0, start);
        const randomPrev = shuffle(previousWords).slice(0, SET_SIZE);
        roundWords = currentWords.concat(randomPrev); // 총 20개
      }

      totalRoundQuestions = roundWords.length * 2; // 객관식 1회 + 주관식 1회
      quizPhase = 'mc';
      quizPool = shuffle(roundWords);

      currentQuestionIdx = 0;
      correctCount = 0;
      mcCorrect = 0;
      spellCorrect = 0;
      isAnswered = false;

      showOnly('quizView');
      showQuestion();
    }

    function openReviewQuiz(filterSetIdx = null) {
      let items = Object.values(wrongLog);

      if (filterSetIdx !== null) {
        const start = filterSetIdx * SET_SIZE;
        const end = Math.min(start + SET_SIZE, vocabulary.length);
        const allowed = new Set(vocabulary.slice(start, end).map(w => w.e));
        items = items.filter(it => allowed.has(it.e));
      }

      if (items.length === 0) {
        alert(filterSetIdx !== null
          ? '이 세트는 남은 오답이 없습니다! 👍'
          : '복습할 오답 단어가 없습니다! 모두 잘 알고 있어요 👍');
        return;
      }

      reviewFilterSetIdx = filterSetIdx;
      quizMode = 'review';
      quizPool = shuffle(items.map(it => ({ e: it.e, k: it.k })));
      currentQuestionIdx = 0;
      correctCount = 0;
      isAnswered = false;

      showOnly('quizView');
      showQuestion();
    }

    // 결과화면에서 '이 세트 오답만 복습하기' 버튼이 호출
    function reviewThisSet() {
      openReviewQuiz(currentSetIdx);
    }

    function showQuestion() {
      isAnswered = false;
      document.getElementById('quizFeedback').innerText = '';
      document.getElementById('nextQuestionBtn').classList.add('hidden');

      const target = quizPool[currentQuestionIdx];
      document.getElementById('progress').innerText = `${currentQuestionIdx + 1} / ${quizPool.length}`;

      const modeLabel = document.getElementById('quizMode');
      if (quizMode === 'review') {
        currentQType = Math.random() < 0.5 ? 'mc' : 'spell';
        modeLabel.innerHTML = "오답노트 복습 <span class='review-badge'>Review</span>";
      } else {
        // 일반 학습: 1단계(객관식 전부) → 2단계(주관식 전부) 순서로 진행
        currentQType = quizPhase;
        const phaseLabel = quizPhase === 'mc' ? '① 객관식' : '② 주관식';

        const start = currentSetIdx * SET_SIZE;
        const end = start + SET_SIZE;
        const globalIdx = vocabulary.findIndex(v => v.e === target.e && v.k === target.k);
        const isNew = (globalIdx >= start && globalIdx < end);
        const reviewBadge = isNew ? '' : " <span class='review-badge'>누적</span>";
        modeLabel.innerHTML = `${phaseLabel}${reviewBadge}`;
      }

      const optionsContainer = document.getElementById('optionsContainer');
      const spellContainer = document.getElementById('spellContainer');
      const spellInput = document.getElementById('spellInput');

      if (currentQType === 'mc') {
        spellContainer.classList.add('hidden');
        optionsContainer.classList.remove('hidden');

        document.getElementById('targetWord').innerText = target.e;

        let options = [target.k];
        while (options.length < 5) {
          const randomVal = vocabulary[Math.floor(Math.random() * vocabulary.length)].k;
          if (!options.includes(randomVal)) options.push(randomVal);
        }
        options = shuffle(options);

        optionsContainer.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => checkAnswer(opt, target.k, btn);
          optionsContainer.appendChild(btn);
        });
      } else {
        optionsContainer.classList.add('hidden');
        spellContainer.classList.remove('hidden');

        // 영어 단어를 보여주고 한국어 뜻을 쓰게 함
        document.getElementById('targetWord').innerText = target.e;

        // 초성 힌트: 첫 번째 뜻의 첫 음절 초성만 공개 (예: ㄷ○○○)
        const hintEl = document.getElementById('spellHint');
        hintEl.innerHTML = `<span class="hint-label">힌트</span>${buildSpellHint(target.k)}`;
        hintEl.classList.remove('hidden');

        spellInput.value = '';
        spellInput.classList.remove('correct', 'wrong');
        spellInput.disabled = false;
        setTimeout(() => spellInput.focus(), 50);
      }
    }

    function checkAnswer(selected, correct, btn) {
      if (isAnswered) return;
      isAnswered = true;

      const target = quizPool[currentQuestionIdx];

      if (selected === correct) {
        correctCount++;
        if (quizMode === 'normal' && quizPhase === 'mc') mcCorrect++;
        btn.classList.add('correct');
        document.getElementById('quizFeedback').innerText = "정답입니다! 훌륭해요! 👍";
        clearWrongIfPresent(target);
      } else {
        btn.classList.add('wrong');
        Array.from(document.getElementsByClassName('option-btn')).forEach(b => {
          if (b.innerText === correct) b.classList.add('correct');
        });
        document.getElementById('quizFeedback').innerText = "아쉽네요! 복습해봅시다! ✍️";
        recordWrong(target);
      }
      document.getElementById('nextQuestionBtn').classList.remove('hidden');
    }

    function submitSpelling() {
      if (isAnswered) return;

      const inputEl = document.getElementById('spellInput');
      // [iPhone fix] iOS 한글 키보드는 마지막 글자를 '조합 중' 상태로 들고 있어서
      // 엔터 직후 바로 value를 읽으면 마지막 글자가 누락될 수 있음.
      // blur()로 조합을 강제 확정한 뒤, 다음 틱에 value를 읽어 채점한다.
      inputEl.blur();
      setTimeout(function () {
      if (isAnswered) return;
      isAnswered = true;

      const target = quizPool[currentQuestionIdx];
      const val = inputEl.value;
      const result = gradeKoreanMeaning(val, target); // 여러 뜻 중 하나 / 오타 1글자 / ~하다 생략 허용

      inputEl.disabled = true;

      if (result.ok) {
        correctCount++;
        if (quizMode === 'normal' && quizPhase === 'spell') spellCorrect++;
        inputEl.classList.add('correct');
        let msg;
        if (result.matchType === 'exact') {
          msg = "정답입니다! 훌륭해요! 👍";
        } else {
          msg = `정답으로 인정! (전체 뜻: ${target.k}) 👍`;
        }
        document.getElementById('quizFeedback').innerText = msg;
        clearWrongIfPresent(target);
      } else {
        inputEl.classList.add('wrong');
        document.getElementById('quizFeedback').innerText = `아쉽네요! 정답: ${target.k} ✍️`;
        recordWrong(target);
      }
      document.getElementById('nextQuestionBtn').classList.remove('hidden');
      }, 0);
    }

    function goNext() {
      currentQuestionIdx++;
      if (currentQuestionIdx < quizPool.length) {
        showQuestion();
        return;
      }

      if (quizMode === 'review') {
        showReviewResult();
        return;
      }

      // 일반 학습 모드: 객관식 전부 끝났으면 주관식 단계로, 주관식까지 끝났으면 결과로
      if (quizPhase === 'mc') {
        quizPhase = 'spell';
        quizPool = shuffle(roundWords);
        currentQuestionIdx = 0;
        spellCorrect = 0; // 주관식 점수는 단계 시작 시점부터 집계
        showQuestion();
      } else {
        // 주관식 커트라인(80점) 판정
        const spellTotal = roundWords.length;
        const spellScore = spellTotal > 0 ? Math.round((spellCorrect / spellTotal) * 100) : 0;

        if (spellScore >= SPELL_CUTOFF) {
          setSpellPass[currentSetIdx] = true;
          saveToLocal();
          showResult(spellScore);
        } else {
          setSpellPass[currentSetIdx] = false;
          saveToLocal();
          showSpellFailResult(spellScore);
        }
      }
    }

    // 주관식 80점 미달 시: 주관식 단계만 다시 풀기
    function retrySpellPhase() {
      quizMode = 'normal';
      quizPhase = 'spell';
      quizPool = shuffle(roundWords);
      currentQuestionIdx = 0;
      spellCorrect = 0;
      isAnswered = false;
      showOnly('quizView');
      showQuestion();
    }

    function showSpellFailResult(spellScore) {
      // 도전 기록은 남기되, 커트라인 미달이므로 세트는 클리어되지 않음
      setAttempted[currentSetIdx] = true;
      saveToLocal();
      updateSetNav();

      const nextBtn = document.getElementById('nextSetBtn');
      nextBtn.classList.remove('hidden');
      nextBtn.disabled = true;
      nextBtn.style.opacity = '0.4';

      const primaryBtn = document.getElementById('primaryResultBtn');
      primaryBtn.innerText = '다시 학습';
      primaryBtn.onclick = initStudy;

      const resultHTML = `
        <h2 style="margin:0 0 10px 0;">주관식 커트라인 미달 😢</h2>
        <p style="margin:0; font-weight:900; font-size:20px; color:#ef4444;">
          주관식 점수: ${spellScore}점 (통과 기준: ${SPELL_CUTOFF}점)
        </p>
        <p style="margin:6px 0 0 0; font-weight:800; color:#64748b;">
          주관식(한국어 뜻 쓰기)에서 ${SPELL_CUTOFF}점 이상을 받아야 이 세트를 통과할 수 있어요.
        </p>
        <button class="main-btn" style="margin-top:16px; background:#dc2626;" onclick="retrySpellPhase()">주관식 다시 풀기</button>
      `;
      document.getElementById('resultContent').innerHTML = resultHTML;
      showOnly('resultView');
    }

    function showResult(spellScore = null) {
      // 이번 회차 점수 기록(표시용, 객관식+주관식 합산) + 도전 완료 표시
      // 재시험이 있었더라도 '최종 객관식 점수 + 최종 주관식 점수'만 합산
      const totalQuiz = totalRoundQuestions || quizPool.length;
      const roundCorrect = mcCorrect + spellCorrect;
      const wrongCountThisRound = totalQuiz - roundCorrect;

      setWrongCounts[currentSetIdx] = wrongCountThisRound;
      setAttempted[currentSetIdx] = true;
      saveToLocal();
      updateSetNav();

      // 이 세트 범위(10개) 안에서 아직 안 풀린 오답이 있는지(객관식+주관식 통틀어) 확인
      const pending = pendingWrongCountForSet(currentSetIdx);
      const cleared = (pending === 0);

      const nextBtn = document.getElementById('nextSetBtn');
      nextBtn.classList.remove('hidden');
      nextBtn.disabled = !cleared;
      nextBtn.style.opacity = cleared ? '1' : '0.4';

      const primaryBtn = document.getElementById('primaryResultBtn');
      primaryBtn.innerText = '다시 학습';
      primaryBtn.onclick = initStudy;

      const resultHTML = `
        <h2 style="margin:0 0 10px 0;">결과</h2>
        <p style="margin:0; font-weight:900; font-size:18px;">이번 회차 점수: ${roundCorrect} / ${totalQuiz}</p>
        ${spellScore !== null ? `<p style="margin:6px 0 0 0; font-weight:900; font-size:18px; color:var(--success);">주관식 점수: ${spellScore}점 (통과 ✅ / 기준 ${SPELL_CUTOFF}점)</p>` : ''}
        <p style="margin:6px 0 0 0; font-weight:900; font-size:18px; color:${cleared ? 'var(--success)' : '#ef4444'};">
          이 세트에 남은 오답: ${pending}개
        </p>
        <p style="margin:14px 0 0 0; color:#64748b; font-weight:800;">
          주관식 ${SPELL_CUTOFF}점 이상 + 이 세트의 오답(객관식·주관식 모두)을 전부 해결해야 다음 세트로 넘어갈 수 있습니다.
        </p>
        ${pending > 0 ? `<button class="main-btn" style="margin-top:14px; background:#dc2626;" onclick="reviewThisSet()">이 세트 오답만 복습하기 (${pending})</button>` : ''}
      `;
      document.getElementById('resultContent').innerHTML = resultHTML;
      showOnly('resultView');
    }

    function showReviewResult() {
      const totalQuiz = quizPool.length;
      const remainingTotal = Object.keys(wrongLog).length;
      const remainingThisSet = (reviewFilterSetIdx !== null) ? pendingWrongCountForSet(reviewFilterSetIdx) : null;
      const remaining = (reviewFilterSetIdx !== null) ? remainingThisSet : remainingTotal;

      // 복습 중이던 세트가 currentSetIdx이고, 그 세트가 이제 완전 클리어됐다면 다음 세트 버튼 노출
      const nextBtn = document.getElementById('nextSetBtn');
      if (isSetCleared(currentSetIdx)) {
        nextBtn.classList.remove('hidden');
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
      } else {
        nextBtn.classList.add('hidden');
      }

      const primaryBtn = document.getElementById('primaryResultBtn');
      if (remaining > 0) {
        primaryBtn.innerText = '오답 다시 복습하기';
        primaryBtn.onclick = () => openReviewQuiz(reviewFilterSetIdx);
      } else {
        primaryBtn.innerText = '학습으로 돌아가기';
        primaryBtn.onclick = () => { quizMode = 'normal'; reviewFilterSetIdx = null; initStudy(); };
      }

      const titleSuffix = (reviewFilterSetIdx !== null) ? ` (Set ${reviewFilterSetIdx + 1} 한정)` : '';

      const resultHTML = `
        <h2 style="margin:0 0 10px 0;">오답노트 복습 결과${titleSuffix}</h2>
        <p style="margin:0; font-weight:900; font-size:18px;">맞춘 개수: ${correctCount} / ${totalQuiz}</p>
        <p style="margin:6px 0 0 0; font-weight:900; font-size:18px; color:${remaining===0 ? 'var(--success)' : '#ef4444'};">
          남은 오답 단어: ${remaining}개
        </p>
        ${remaining === 0 ? '<p style="margin:14px 0 0 0; color:var(--success); font-weight:900;">오답을 모두 클리어했어요! 🎉</p>' : ''}
      `;
      document.getElementById('resultContent').innerHTML = resultHTML;
      showOnly('resultView');
    }

    function moveToNextSet() {
      if (!isSetCleared(currentSetIdx)) {
        alert('주관식 80점 이상 + 이 세트의 오답(객관식·주관식 모두)을 전부 해결해야 다음 세트로 넘어갈 수 있어요.');
        return;
      }
      const ts = totalSets();
      if (currentSetIdx < ts - 1) currentSetIdx++;
      saveToLocal();
      initStudy();
    }

    // 초기 실행
    synonymMap = buildSynonymMap();
    loadFromLocal();
    // 저장 데이터가 있더라도 '연속 100점' 규칙을 우선 적용
    const unlockedMaxInit = maxUnlockedSetIdx();
    if (currentSetIdx > unlockedMaxInit) {
      currentSetIdx = unlockedMaxInit;
      saveToLocal();
    }
    updateReviewBtnLabel();
    initStudy();
  </script>

      position:fixed;
      right:12px;

      padding:6px 10px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      z-index:9999;
      user-select:none;
    }
  </style>
