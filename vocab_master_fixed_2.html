<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vocab Master: 통합 Edition</title>
  <style>
    :root{
      --bg:#0f1115; --card:#171a21; --text:#f2f3f5; --muted:#a7adbb;
      --border:rgba(255,255,255,.14); --btn:#222635; --accent:#7aa2ff;
      --correct:#2e7d32; --wrong:#c62828; --progress:#4caf50; --gold:#ffd700;
    }
    body.light-mode {
      --bg:#f0f2f5; --card:#ffffff; --text:#1a1a2e; --muted:#666888;
      --border:rgba(0,0,0,.15); --btn:#e8eaf0; --accent:#4a6fd4;
      --correct:#2e7d32; --wrong:#c62828; --progress:#388e3c; --gold:#c8960c;
    }
    *{ box-sizing:border-box; font-family: 'Pretendard', system-ui, sans-serif; }
    body{ margin:0; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:15px; transition:background 0.3s,color 0.3s; }
    .wrap{ width:100%; max-width:500px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:24px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.5); text-align:center; position:relative; }

    .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:8px; }
    .set-selector{ background:var(--btn); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font-size:14px; cursor:pointer; outline:none; flex-grow:1; font-weight:bold; }
    .best-score{ font-size:11px; padding:4px 8px; border-radius:6px; background:rgba(122,162,255,0.1); color:var(--accent); border:1px solid rgba(122,162,255,0.3); white-space:nowrap; }
    .perfect-badge{ background:rgba(255,215,0,0.1); color:var(--gold); border:1px solid var(--gold); }
    .theme-btn{ background:var(--btn); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:16px; flex-shrink:0; }

    /* 통과 조건 진행 표시 */
    .pass-status{ display:flex; gap:6px; margin-bottom:14px; }
    .pass-chip{ flex:1; padding:8px 4px; border-radius:10px; border:1px solid var(--border); background:var(--btn); color:var(--muted); font-size:11px; font-weight:bold; text-align:center; transition:0.3s; }
    .pass-chip.done{ background:rgba(46,125,50,0.2); color:#4caf50; border-color:#4caf50; }
    .pass-chip.active{ border-color:var(--accent); color:var(--accent); background:rgba(122,162,255,0.1); }

    .tab-bar{ display:flex; gap:6px; margin-bottom:15px; }
    .tab-btn{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--btn); color:var(--muted); cursor:pointer; font-size:13px; font-weight:bold; transition:0.2s; }
    .tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .tab-btn.locked{ opacity:0.4; cursor:not-allowed; }
    .tab-btn.cleared{ position:relative; }
    .tab-btn.cleared::after{ content:"✓"; position:absolute; top:-6px; right:-4px; background:#4caf50; color:#fff; border-radius:50%; width:16px; height:16px; font-size:10px; display:flex; align-items:center; justify-content:center; }

    .study-list{ list-style:none; padding:5px; margin:15px 0; text-align:left; max-height:40vh; overflow-y:auto; border:1px solid var(--border); border-radius:12px; background:rgba(0,0,0,0.1); }
    .study-item{ display:flex; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); font-size:15px; }
    .study-item:last-child{ border-bottom:none; }
    .study-item b{ color:var(--accent); }

    .word-box{ margin-bottom:20px; min-height:110px; display:flex; flex-direction:column; justify-content:center; }
    .word-box h1{ font-size:clamp(28px,9vw,44px); margin:0; letter-spacing:-1px; color:var(--text); word-break:break-all; }
    .word-box .hint{ font-size:15px; line-height:1.5; color:var(--muted); margin-top:10px; padding:0 6px; word-break:break-word; }
    .word-box .hint b{ font-weight:700; }
    .choseong-hint{ font-size:18px; font-weight:700; color:var(--accent); letter-spacing:4px; margin:2px 0 14px; min-height:1.2em; }
    .choseong-hint .cho-label{ font-size:12px; font-weight:600; color:var(--muted); letter-spacing:0; margin-right:8px; }

    .options{ display:grid; gap:10px; }
    .opt-btn{ background:var(--btn); border:1px solid var(--border); color:var(--text); padding:16px; border-radius:14px; cursor:pointer; text-align:left; font-size:15px; transition:0.2s; }
    .opt-btn:hover:not(:disabled){ border-color:var(--accent); }
    .opt-btn.correct{ background:var(--correct)!important; color:#fff; border-color:transparent; font-weight:bold; }
    .opt-btn.wrong{ background:var(--wrong)!important; color:#fff; border-color:transparent; }

    .write-input{ width:100%; padding:16px; background:var(--btn); border:2px solid var(--border); border-radius:14px; color:var(--text); font-size:20px; text-align:center; margin-bottom:10px; outline:none; transition:0.2s; }
    .write-input:focus{ border-color:var(--accent); }
    .write-input.correct-input{ border-color:var(--correct); background:rgba(46,125,50,0.15); }
    .write-input.wrong-input{ border-color:var(--wrong); background:rgba(198,40,40,0.1); }
    .write-answer-hint{ font-size:14px; color:var(--correct); font-weight:bold; min-height:1.4em; margin-bottom:8px; }

    .similarity-badge{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; font-weight:bold; }
    .badge-exact{ background:rgba(46,125,50,0.2); color:#4caf50; }
    .badge-similar{ background:rgba(255,193,7,0.2); color:#ffc107; }

    .main-btn{ width:100%; padding:16px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-weight:800; cursor:pointer; margin-top:10px; font-size:16px; transition:0.3s; }
    .main-btn:hover{ opacity:0.88; transform:scale(1.01); }
    .retry-btn{ background:var(--btn); border:1px solid var(--accent); color:var(--accent); }
    .retry-btn:hover{ background:var(--accent); color:#fff; }
    .wrong-only-btn{ background:var(--btn); border:1px solid #ff7043; color:#ff7043; }
    .wrong-only-btn:hover{ background:#ff7043; color:#fff; }

    .reset-link{ display:block; margin-top:12px; font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none; width:100%; }
    .hidden{ display:none!important; }

    .result-score{ font-size:68px; font-weight:900; margin:10px 0; color:var(--text); }
    .celebrate{ animation:celebrate-pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) infinite alternate; color:var(--gold); }
    @keyframes celebrate-pop{ 0%{ transform:scale(1); filter:drop-shadow(0 0 5px var(--gold)); } 100%{ transform:scale(1.1); filter:drop-shadow(0 0 20px var(--gold)); } }

    .wrong-note-list{ text-align:left; max-height:45vh; overflow-y:auto; border:1px solid var(--border); border-radius:12px; padding:5px; margin:12px 0; background:rgba(198,40,40,0.05); }
    .wrong-note-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); font-size:14px; }
    .wrong-note-item:last-child{ border-bottom:none; }
    .wrong-note-item .wn-word{ font-weight:bold; color:var(--accent); min-width:100px; }
    .wrong-note-item .wn-count{ font-size:12px; color:#ff7043; font-weight:bold; padding:2px 8px; background:rgba(255,112,67,0.1); border-radius:10px; white-space:nowrap; }
    .wrong-note-item .wn-meaning{ color:var(--muted); font-size:13px; flex:1; text-align:left; padding:0 8px; }
    .wrong-note-item .wn-del{ flex:0 0 auto; font-size:12px; font-weight:bold; color:var(--progress); background:rgba(46,125,50,0.10); border:1px solid var(--progress); border-radius:10px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
    .wrong-note-item .wn-del:active{ transform:scale(0.94); }
    .empty-note{ padding:30px; color:var(--muted); font-size:14px; }

    .progress-bar-wrap{ width:100%; height:4px; background:var(--border); border-radius:2px; margin-bottom:14px; }
    .progress-bar-fill{ height:100%; background:var(--accent); border-radius:2px; transition:width 0.3s; }

    /* 단계 잠금 안내 */
    .lock-notice{ background:rgba(255,112,67,0.1); border:1px solid #ff7043; border-radius:12px; padding:14px; margin-top:12px; font-size:13px; color:#ff7043; line-height:1.6; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <select id="set-jump" class="set-selector" onchange="jumpToSet(this.value)"></select>
    <span id="stat-badge" class="best-score">Ready</span>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- 3단계 통과 진행 표시 -->
  <div id="pass-status" class="pass-status hidden">
    <div class="pass-chip" id="chip-mc">① 객관식</div>
    <div class="pass-chip" id="chip-wr">② 주관식</div>
    <div class="pass-chip" id="chip-wn">③ 오답노트</div>
  </div>

  <!-- 탭 -->
  <div id="main-tabs" class="tab-bar hidden">
    <button class="tab-btn" id="tab-mc" onclick="tryTab('mc')">객관식</button>
    <button class="tab-btn" id="tab-wr" onclick="tryTab('wr')">주관식</button>
    <button class="tab-btn" id="tab-wn" onclick="tryTab('wn')">오답노트</button>
  </div>

  <!-- 학습 화면 -->
  <div id="study-view" class="card">
    <h2 id="study-title" style="margin-top:0;font-size:20px;">단어 암기 (통합)</h2>
    <p id="review-badge" style="font-size:12px;color:var(--accent);margin-top:-10px;" class="hidden">★ 이전 학습 단어 10개가 무작위 시험에 포함됩니다!</p>
    <div id="study-list" class="study-list"></div>
    <div id="pass-info" class="lock-notice hidden"></div>
    <button class="main-btn" id="start-btn" onclick="startMode()">마스터 시험 시작</button>
    <button class="reset-link" onclick="resetAllProgress()">모든 학습 기록 초기화</button>
  </div>

  <!-- 객관식 화면 -->
  <div id="quiz-view" class="card hidden">
    <div class="header">
      <span class="best-score">① 객관식</span>
      <span id="quiz-progress-text" style="color:var(--accent);font-weight:bold;">남은 단어: 0</span>
    </div>
    <div class="progress-bar-wrap"><div id="quiz-progress-bar" class="progress-bar-fill" style="width:0%"></div></div>
    <div class="word-box"><h1 id="target-word">Word</h1></div>
    <div id="options-container" class="options"></div>
    <div id="feedback" style="margin-top:16px;font-size:15px;font-weight:bold;min-height:1.2em;"></div>
    <button id="next-q-btn" class="main-btn hidden" onclick="renderQuestion()">다음 문제 →</button>
  </div>

  <!-- 주관식 화면 -->
  <div id="write-view" class="card hidden">
    <div class="header">
      <span class="best-score">② 주관식</span>
      <span id="write-progress-text" style="color:var(--accent);font-weight:bold;">0 / 0</span>
    </div>
    <div class="progress-bar-wrap"><div id="write-progress-bar" class="progress-bar-fill" style="width:0%"></div></div>
    <div class="word-box">
      <h1 id="write-target-word">Word</h1>
      <div class="hint" id="write-hint"></div>
    </div>
    <div class="choseong-hint" id="write-choseong"></div>
    <input type="text" id="write-input" class="write-input" placeholder="한글 뜻을 입력하세요" onkeydown="handleWriteKey(event)" autocomplete="off" autocorrect="off" />
    <div id="write-answer-hint" class="write-answer-hint"></div>
    <button id="write-submit-btn" class="main-btn" onclick="submitWriteAnswer()">확인</button>
    <button id="write-next-btn" class="main-btn hidden" onclick="nextWriteQuestion()">다음 문제 →</button>
  </div>

  <!-- 오답노트 화면 -->
  <div id="wrong-note-view" class="card hidden">
    <div class="header">
      <span class="best-score">③ 오답노트</span>
      <span id="wn-count" style="color:var(--accent);font-weight:bold;">0개</span>
    </div>
    <p style="font-size:13px;color:var(--muted);margin:4px 0 12px;line-height:1.5;">틀린 단어만 모았어요. 복습에서 맞히면 목록에서 자동으로 사라집니다.</p>
    <div id="wn-actions" style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="main-btn" style="margin:0;flex:1;" onclick="startWrongReview('mc')">객관식 복습</button>
      <button class="main-btn" style="margin:0;flex:1;" onclick="startWrongReview('wr')">주관식 복습</button>
    </div>
    <div id="wn-list" class="wrong-note-list"></div>
    <button class="reset-link" onclick="loadSet()">← 학습 화면으로</button>
  </div>

  <!-- 결과 화면 -->
  <div id="result-view" class="card hidden">
    <h2 id="result-title">CLEAR!</h2>
    <div id="result-score-container" class="result-score">🏆</div>
    <p id="result-msg" style="line-height:1.6;padding:0 20px;font-size:14px;"></p>
    <div id="result-next-area"></div>
  </div>
</div>

function getSetRec(idx) {
  return studyProgress[idx] || { mcPass:false, wrPass:false, wnPass:false, bestMc:0, bestWr:0, bestWn:0 };
}

function isSetFullyCleared(idx) {
  const r = getSetRec(idx);
  return r.mcPass && r.wrPass && r.wnPass;   // ① 객관식 ② 주관식 ③ 오답노트(100점)
}

function getMaxAllowedSetIndex() {
  const totalSets = Math.ceil(ALL_WORDS.length / 10);
  let allowed = 0;
  for (let i = 0; i < totalSets; i++) {
    if (isSetFullyCleared(i)) allowed = i + 1;
    else break;
  }
  return Math.min(allowed, totalSets - 1);
}

function enforceSetLock() {
  const max = getMaxAllowedSetIndex();
  if (currentSetIndex > max) currentSetIndex = max;
}

// 현재 세트에서 다음 해야 할 단계
function nextRequiredStage() {
  const r = getSetRec(currentSetIndex);
  if (!r.mcPass) return 'mc';
  if (!r.wrPass) return 'wr';
  if (!r.wnPass) return 'wn';
  return 'done';
}

// ==================== 유사도 ====================
function normalize(str) {
  return str
    .replace(/[,，、·\s]/g, '')
    .replace(/[\(\)（）]/g, '')
    .replace(/하다$/, '').replace(/시키다$/, '').replace(/되다$/, '')
    .trim();
}

function isSimilarEnough(input, answer) {
  // 유의어/부분일치/오타 허용 없이, 표기된 뜻과 완전히 일치할 때만 정답 처리
  const normInput = normalize(input);
  const normAnswer = normalize(answer);
  if (normInput === normAnswer) return { match: true, type: 'exact' };
  const parts = answer.split(/[,，、]/);
  for (const part of parts) {
    const normPart = normalize(part);
    if (normInput === normPart) return { match: true, type: 'exact' };
  }
  return { match: false };
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function createSetOptions() {
  const sel = document.getElementById('set-jump');
  const totalSets = Math.ceil(ALL_WORDS.length / 10);
  const maxAllowed = getMaxAllowedSetIndex();
  sel.innerHTML = '';
  for (let i = 0; i < totalSets; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    const r = getSetRec(i);
    const cleared = isSetFullyCleared(i);
    const locked = i > maxAllowed;
    opt.disabled = locked;
    const tag = cleared ? ' ✅' : (locked ? ' 🔒' : '');
    opt.textContent = `SET ${i+1}${tag} (MC:${r.bestMc||0} WR:${r.bestWr||0})`;
    sel.appendChild(opt);
  }
  sel.value = currentSetIndex;
}

function jumpToSet(val) {
  const req = parseInt(val);
  const max = getMaxAllowedSetIndex();
  if (req > max) {
    document.getElementById('set-jump').value = currentSetIndex;
    alert('이전 세트를 3단계 모두 통과해야 이동할 수 있습니다.');
    return;
  }
  currentSetIndex = req;
  loadSet();
  saveLocal();
}

function shuffle(arr) {
  let a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startMCQuiz() {

  quizQueue = [...quizQueue.length ? quizQueue : []]; // 이미 세팅된 큐 사용
  // 새로 시작 시 재셔플

  let cw = ALL_WORDS.slice(start,start+10);
  let rv = currentSetIndex>0 ? shuffle(ALL_WORDS.slice(0,start)).slice(0,10) : [];

  quizTotal = quizQueue.length;

function renderQuestion() {
  document.getElementById('next-q-btn').classList.add('hidden');
  document.getElementById('feedback').innerText='';
  const rem = quizQueue.length;
  document.getElementById('quiz-progress-text').innerText=`남은 단어: ${rem}`;
  const pct = quizTotal>0?Math.round(((quizTotal-rem)/quizTotal)*100):0;
  document.getElementById('quiz-progress-bar').style.width=pct+'%';
  if(rem===0){ showFinalResult('mc'); return; }

  document.getElementById('target-word').innerText=item.w;
  let opts=[item,...shuffle(ALL_WORDS.filter(w=>w.m!==item.m)).slice(0,4)];
  opts=shuffle(opts);
  const cont=document.getElementById('options-container');
  cont.innerHTML='';
  opts.forEach(opt=>{

    btn.className='opt-btn'; btn.innerText=opt.m;

function handleMCAnswer(isCorrect,btn,item){
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(isCorrect){
    btn.classList.add('correct');
    document.getElementById('feedback').innerText='Correct! ✨';

function choseong(str){
  // 첫 번째 한글 음절의 초성만 공개, 나머지 음절은 ○로 표시 (난이도 상향)
  const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  let out='';
  let firstShown=false;
  for(const ch of str){
    const code=ch.charCodeAt(0);
    if(code>=0xAC00 && code<=0xD7A3){
      if(!firstShown){ out+=CHO[Math.floor((code-0xAC00)/588)]; firstShown=true; }
      else out+='○';
    }
    else if(ch===' ') out+=' ';
    // 영문/숫자/기호는 무시
  }
  return out.trim();
}

function setChoseong(item){
  const el=document.getElementById('write-choseong');
  if(!el) return;
  const first=(item.m.split(/[,，、]/)[0]||'').trim();  // 첫 번째 뜻 기준
  const cho=choseong(first);
  el.innerHTML = cho ? '<span class="cho-label">초성 힌트</span>'+cho : '';
}

function setWriteHint(item){
  const el=document.getElementById('write-hint');
  if(!el) return;
  const ex = (typeof EXAMPLES!=='undefined') ? EXAMPLES[item.w] : null;
  if(ex){
    // 예문 안의 표제어(굴절형 포함)를 강조
    const re = new RegExp('('+item.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','i');
    el.innerHTML = '💬 ' + ex.replace(re, '<b style="color:var(--accent)">$1</b>');
  } else {
    el.innerHTML = '';
  }
}

function renderWriteQuestion(){
  if(writeCurrent>=writeTotal){ showFinalResult('wr'); return; }
  const item=writeQueue[writeCurrent];
  document.getElementById('write-target-word').innerText=item.w;
  setWriteHint(item);
  setChoseong(item);
  document.getElementById('write-answer-hint').innerText='';
  const inp=document.getElementById('write-input');
  inp.value=''; inp.className='write-input'; inp.disabled=false; inp.focus();
  document.getElementById('write-submit-btn').classList.remove('hidden');
  document.getElementById('write-next-btn').classList.add('hidden');
  writeAnswerShown=false;
  const pct=writeTotal>0?Math.round((writeCurrent/writeTotal)*100):0;
  document.getElementById('write-progress-bar').style.width=pct+'%';
  document.getElementById('write-progress-text').innerText=`주관식 ${writeCurrent+1} / ${writeTotal}`;
}

function handleWriteKey(e){
  if(e.key!=='Enter') return;
  if(!writeAnswerShown) submitWriteAnswer(); else nextWriteQuestion();
}

function submitWriteAnswer(){
  if(wnStageActive){ submitWnAnswer(); return; }
  if(wrongReviewActive){ submitWrongReviewWR(); return; }
  if(writeMode==='wrongonly'){ submitWriteWrongAnswer(); return; }
  const inp=document.getElementById('write-input');
  const userInput=inp.value.trim(); if(!userInput) return;
  const item=writeQueue[writeCurrent];
  const result=isSimilarEnough(userInput,item.m);
  inp.disabled=true;
  document.getElementById('write-submit-btn').classList.add('hidden');
  document.getElementById('write-next-btn').classList.remove('hidden');
  writeAnswerShown=true;
  if(result.match){
    inp.classList.add('correct-input');
    const badge=result.type==='exact'
      ?'<span class="similarity-badge badge-exact">완전 일치 ✓</span>'
      :'<span class="similarity-badge badge-similar">유사 정답 ✓</span>';
    document.getElementById('write-answer-hint').innerHTML=`정답: ${item.m} ${badge}`;
    document.getElementById('write-answer-hint').style.color='var(--progress)';
    writeCorrectCount++;
  } else {
    inp.classList.add('wrong-input');
    document.getElementById('write-answer-hint').innerHTML=`정답: <b>${item.m}</b>`;
    document.getElementById('write-answer-hint').style.color='var(--wrong)';
    writeWrongWords.add(item.w);
    writeWrongPool[item.w]=item;   // 1~3회차 누적 오답 풀
    wrongLog[item.w]=(wrongLog[item.w]||0)+1;
    saveLocal();
  }
}

function nextWriteQuestion(){
  if(wnStageActive){ renderWnQuestion(); return; }
  if(wrongReviewActive){ renderWrongReviewWR(); return; }
  if(writeMode==='wrongonly'){ nextWriteWrongQuestion(); return; }
  writeCurrent++; renderWriteQuestion();
}

function passWriteStage(){ passWriteWrongStage(); }

function rebuildWriteWrongQueue(){
  writeWrongQueue=shuffle(Object.keys(writeNeed).filter(w=>writeNeed[w]>0).map(w=>writeWrongPool[w]));
}

function writeWrongProgress(){
  const totalWords=Object.keys(writeNeed).length;
  const remaining=Object.keys(writeNeed).filter(w=>writeNeed[w]>0).length;
  return { totalWords, remaining, cleared: totalWords-remaining };
}

function renderWriteWrongQuestion(){
  const p=writeWrongProgress();
  if(p.remaining===0){ passWriteWrongStage(); return; }
  if(writeWrongQueue.length===0) rebuildWriteWrongQueue();
  const item=writeWrongQueue[0];

  document.getElementById('write-next-btn').classList.add('hidden');

function submitWriteWrongAnswer(){
  const inp=document.getElementById('write-input');
  const userInput=inp.value.trim(); if(!userInput) return;
  const item=writeWrongQueue[0];
  const result=isSimilarEnough(userInput,item.m);
  inp.disabled=true;
  document.getElementById('write-submit-btn').classList.add('hidden');
  document.getElementById('write-next-btn').classList.remove('hidden');
  writeAnswerShown=true;
  if(result.match){
    inp.classList.add('correct-input');
    writeNeed[item.w]=Math.max(0,(writeNeed[item.w]||0)-1);
    const left=writeNeed[item.w];
    const badge=result.type==='exact'
      ?'<span class="similarity-badge badge-exact">완전 일치 ✓</span>'
      :'<span class="similarity-badge badge-similar">유사 정답 ✓</span>';
    const msg = left>0 ? `정답: ${item.m} ${badge} <small>(${left}번 더!)</small>`
                       : `정답: ${item.m} ${badge} <small>(이 단어 통과 ✅)</small>`;
    document.getElementById('write-answer-hint').innerHTML=msg;
    document.getElementById('write-answer-hint').style.color='var(--progress)';
    writeWrongQueue.shift();  // 맞히면 큐에서 제거 (left>0이면 다음 회전에 재등장)
  } else {
    inp.classList.add('wrong-input');
    document.getElementById('write-answer-hint').innerHTML=`정답: <b>${item.m}</b> <small>(다시 도전)</small>`;
    document.getElementById('write-answer-hint').style.color='var(--wrong)';
    wrongLog[item.w]=(wrongLog[item.w]||0)+1;
    saveLocal();
    const w=writeWrongQueue.shift(); writeWrongQueue.push(w);  // 틀리면 뒤로 보냄 (진행도 유지)
  }
}

function nextWriteWrongQuestion(){

    wrongReviewQueue.shift();
  } else {
    inp.classList.add('wrong-input');
    document.getElementById('write-answer-hint').innerHTML=`정답: <b>${item.m}</b> <small>(다시 출제됩니다)</small>`;
    document.getElementById('write-answer-hint').style.color='var(--wrong)';
    const w=wrongReviewQueue.shift(); wrongReviewQueue.push(w);
  }
}

// ==================== 결과 (① 객관식) ====================
function showFinalResult(mode){
  hideAll();
  document.getElementById('result-view').classList.remove('hidden');

  // 주관식 완료는 별도 처리
  if(mode==='wr'){ finishWriteSinglePass(); return; }

  // === 객관식 채점 ===
  const wrongCount=wrongWords.size;
  const total=quizTotal;
  const score=Math.round(((total-wrongCount)/Math.max(1,total))*100);
  wrongOnlyMode=false;

  const r=getSetRec(currentSetIndex);
  r.bestMc=Math.max(r.bestMc||0,score);
  if(score>=PASS_MC) r.mcPass=true;
  studyProgress[currentSetIndex]=r;
  saveLocal(); createSetOptions(); updateHeaderStats();

  const passed=score>=PASS_MC;
  const allCleared=isSetFullyCleared(currentSetIndex);

  document.getElementById('result-title').innerText = passed?'🏆 객관식 통과!':'① 객관식 결과';
  const scoreBox=document.getElementById('result-score-container');
  scoreBox.classList.remove('celebrate'); scoreBox.innerText=`${score}점`;
  if(score===100) scoreBox.classList.add('celebrate');

  let msg=`<b>[① 객관식] ${score}점</b><br>`;
  if(passed){
    msg += allCleared
      ? '통과! ✅<br><b>🎉 SET 전체 완료! 다음 SET으로 이동할 수 있어요.</b>'
      : '통과! ✅<br>이제 ② 주관식을 풀어보세요.';
  } else {
    msg += `틀린 단어 ${wrongCount}개 · <b>${PASS_MC}점 이상</b>이면 통과돼요. 다시 도전!`;
  }
  document.getElementById('result-msg').innerHTML=msg;

  const area=document.getElementById('result-next-area');
  area.innerHTML='';
  if(passed && allCleared){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='다음 SET으로 이동 →';
    btn.onclick=moveToNextSet; area.appendChild(btn);
  } else if(passed){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='② 주관식 시작 →';
    btn.onclick=()=>{
      hideAll(); showTabBar();
      ['tab-mc','tab-wr'].forEach(id=>document.getElementById(id).classList.remove('active'));
      document.getElementById('tab-wr').classList.add('active');
      startWriteQuiz();
    };
    area.appendChild(btn);
  }

  const retryBtn=document.createElement('button');
  retryBtn.className='main-btn retry-btn'; retryBtn.textContent='🔄 다시 시도';
  retryBtn.onclick=startMCQuiz; area.appendChild(retryBtn);

  const backBtn=document.createElement('button');
  backBtn.className='main-btn retry-btn'; backBtn.style.marginTop='6px'; backBtn.textContent='← 학습 화면으로';
  backBtn.onclick=backToStudy; area.appendChild(backBtn);
}

// 주관식 완료 채점 (PASS_WR 이상이면 통과, 미만이면 다시 도전)
function finishWriteSinglePass(){
  const sc=Math.round((writeCorrectCount/Math.max(1,writeTotal))*100);
  const r=getSetRec(currentSetIndex);
  r.bestWr=Math.max(r.bestWr||0,sc);
  if(sc>=PASS_WR){
    r.wrPass=true;
    // 이번 주관식에서 틀린 단어를 ③ 오답노트 단계용으로 저장
    r.wrWrong=[...writeWrongWords];
    if(r.wrWrong.length===0) r.wnPass=true;   // 오답 없으면 ③ 자동 통과
  }
  studyProgress[currentSetIndex]=r;
  saveLocal(); createSetOptions(); updateHeaderStats();
  showWriteResult(sc);
}

// 주관식 결과 화면
function showWriteResult(sc){
  hideAll();
  document.getElementById('result-view').classList.remove('hidden');
  const passed=sc>=PASS_WR;
  const allCleared=isSetFullyCleared(currentSetIndex);
  const r=getSetRec(currentSetIndex);

  document.getElementById('result-title').innerText = passed?'🏆 주관식 통과!':'② 주관식 결과';
  const sb=document.getElementById('result-score-container');
  sb.classList.remove('celebrate'); sb.innerText=`${sc}점`;
  if(sc===100) sb.classList.add('celebrate');

  let msg=`<b>[② 주관식] ${sc}점</b><br>`;
  if(passed){
    if(allCleared){
      msg += '통과! ✅<br><b>🎉 SET 전체 완료! 다음 SET으로 이동할 수 있어요.</b>';
    } else if(!r.wnPass){
      msg += `통과! ✅<br><b>이제 ③ 오답노트에서 틀린 ${(r.wrWrong||[]).length}개를 다시 풀어요. (100점이어야 통과)</b>`;
    } else {
      msg += '통과! ✅<br>남은 ① 객관식을 마저 풀어보세요.';
    }
  } else {
    msg += `<b>${PASS_WR}점 이상</b>이면 통과돼요. 다시 도전!`;
  }
  document.getElementById('result-msg').innerHTML=msg;

  const area=document.getElementById('result-next-area'); area.innerHTML='';
  if(passed && allCleared){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='다음 SET으로 이동 →';
    btn.onclick=moveToNextSet; area.appendChild(btn);
  } else if(passed && !r.wnPass){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent=`③ 오답노트 풀기 → (${(r.wrWrong||[]).length}개)`;
    btn.onclick=startWrongNoteStage; area.appendChild(btn);
  } else if(passed){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='① 객관식 시작 →';
    btn.onclick=()=>{
      hideAll(); showTabBar();
      ['tab-mc','tab-wr','tab-wn'].forEach(id=>document.getElementById(id).classList.remove('active'));
      document.getElementById('tab-mc').classList.add('active');
      startMCQuiz();
    };
    area.appendChild(btn);
  } else {
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='🔄 주관식 다시 도전';
    btn.onclick=startWriteQuiz; area.appendChild(btn);
  }

  const backBtn=document.createElement('button');
  backBtn.className='main-btn retry-btn'; backBtn.style.marginTop='6px'; backBtn.textContent='← 학습 화면으로';
  backBtn.onclick=backToStudy; area.appendChild(backBtn);
}

// ==================== ③ 오답노트 단계 (세트별 주관식 오답 재시험, 100점 통과) ====================
let wnStageActive = false;
let wnQueue = [];
let wnTotal = 0;
let wnCorrect = 0;

function startWrongNoteStage(){
  const r=getSetRec(currentSetIndex);
  if(!r.mcPass){ alert('① 객관식을 먼저 통과하세요!'); return; }
  if(!r.wrPass){ alert('② 주관식을 먼저 통과하세요!'); return; }
  const words=(r.wrWrong||[]).map(w=>ALL_WORDS.find(x=>x.w===w)).filter(Boolean);
  if(words.length===0){
    r.wnPass=true; studyProgress[currentSetIndex]=r; saveLocal(); createSetOptions(); updateHeaderStats();
    alert('주관식에서 틀린 단어가 없어 ③ 오답노트를 통과 처리합니다! 🎉');
    showWnResult(100); return;
  }
  wnStageActive=true;
  wnQueue=shuffle([...words]); wnTotal=wnQueue.length; wnCorrect=0;
  hideAll(); showTabBar();
  ['tab-mc','tab-wr','tab-wn'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('tab-wn').classList.add('active');
  document.getElementById('write-view').classList.remove('hidden');
  const lab=document.querySelector('#write-view .best-score'); if(lab) lab.textContent='③ 오답노트';
  renderWnQuestion();
}

function renderWnQuestion(){
  if(wnQueue.length===0){ finishWnStage(); return; }
  const done=wnTotal-wnQueue.length;
  const item=wnQueue[0];
  document.getElementById('write-target-word').innerText=item.w;
  setWriteHint(item);
  setChoseong(item);
  document.getElementById('write-answer-hint').innerText='';
  const inp=document.getElementById('write-input');
  inp.value=''; inp.className='write-input'; inp.disabled=false; inp.focus();
  document.getElementById('write-submit-btn').classList.remove('hidden');
  document.getElementById('write-next-btn').classList.add('hidden');
  writeAnswerShown=false;
  const pct=wnTotal>0?Math.round((done/wnTotal)*100):0;
  document.getElementById('write-progress-bar').style.width=pct+'%';
  document.getElementById('write-progress-text').innerText=`③ 오답노트 ${done+1} / ${wnTotal} · 100점 통과`;
}

function submitWnAnswer(){
  const inp=document.getElementById('write-input');
  const userInput=inp.value.trim(); if(!userInput) return;
  const item=wnQueue[0];
  const result=isSimilarEnough(userInput,item.m);
  inp.disabled=true;
  document.getElementById('write-submit-btn').classList.add('hidden');
  document.getElementById('write-next-btn').classList.remove('hidden');
  writeAnswerShown=true;
  if(result.match){
    inp.classList.add('correct-input');
    const badge=result.type==='exact'
      ?'<span class="similarity-badge badge-exact">완전 일치 ✓</span>'
      :'<span class="similarity-badge badge-similar">유사 정답 ✓</span>';
    document.getElementById('write-answer-hint').innerHTML=`정답: ${item.m} ${badge}`;
    document.getElementById('write-answer-hint').style.color='var(--progress)';
    wnCorrect++;
    wnQueue.shift();
  } else {
    inp.classList.add('wrong-input');
    document.getElementById('write-answer-hint').innerHTML=`정답: <b>${item.m}</b> <small>(틀리면 100점이 안 돼요)</small>`;
    document.getElementById('write-answer-hint').style.color='var(--wrong)';
    wrongLog[item.w]=(wrongLog[item.w]||0)+1; saveLocal();
    wnQueue.shift();   // 이번 회차는 한 번씩만, 100점 아니면 회차 전체 재도전
  }
}

function finishWnStage(){
  const sc=Math.round((wnCorrect/Math.max(1,wnTotal))*100);
  wnStageActive=false;
  const r=getSetRec(currentSetIndex);
  r.bestWn=Math.max(r.bestWn||0,sc);
  if(sc>=100) r.wnPass=true;     // 100점이어야 통과
  studyProgress[currentSetIndex]=r;
  saveLocal(); createSetOptions(); updateHeaderStats();
  showWnResult(sc);
}

function showWnResult(sc){
  hideAll();
  document.getElementById('result-view').classList.remove('hidden');
  const passed=sc>=100;
  const allCleared=isSetFullyCleared(currentSetIndex);
  document.getElementById('result-title').innerText = passed?'🏆 오답노트 통과!':'③ 오답노트 결과';
  const sb=document.getElementById('result-score-container');
  sb.classList.remove('celebrate'); sb.innerText=`${sc}점`;
  if(passed) sb.classList.add('celebrate');

  let msg=`<b>[③ 오답노트] ${sc}점</b><br>`;
  msg += passed
    ? (allCleared ? '통과! ✅<br><b>🎉 SET 전체 완료! 다음 SET으로 이동할 수 있어요.</b>' : '통과! ✅')
    : '<b>100점이어야 통과</b>해요. 틀린 단어를 한 번 더! 다시 도전하세요.';
  document.getElementById('result-msg').innerHTML=msg;

  const area=document.getElementById('result-next-area'); area.innerHTML='';
  if(passed && allCleared){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='다음 SET으로 이동 →';
    btn.onclick=moveToNextSet; area.appendChild(btn);
  } else if(!passed){
    const btn=document.createElement('button');
    btn.className='main-btn'; btn.textContent='🔄 오답노트 다시 도전';
    btn.onclick=startWrongNoteStage; area.appendChild(btn);
  }
  const backBtn=document.createElement('button');
  backBtn.className='main-btn retry-btn'; backBtn.style.marginTop='6px'; backBtn.textContent='← 학습 화면으로';
  backBtn.onclick=backToStudy; area.appendChild(backBtn);
}

// ==================== (복습시험 파트 제거됨) ====================

function moveToNextSet(){
  if((currentSetIndex+1)*10<ALL_WORDS.length) currentSetIndex++;
  else { alert('모든 세트를 완료했습니다! 🎉'); currentSetIndex=0; }
  saveLocal(); createSetOptions(); loadSet();
}

function resetAllProgress(){
  if(confirm('모든 학습 기록과 오답 노트를 초기화하시겠습니까?')){
    localStorage.clear(); studyProgress={}; wrongLog={};
    currentSetIndex=0; createSetOptions(); loadSet(); alert('초기화되었습니다.');
  }
}

// ==================== 초기화 ====================
function migrateProgress(){
  // 구버전(2단계)에서 mc+wr만 통과한 세트는 wnPass를 true로 인정(재잠금 방지)
  let changed=false;
  Object.keys(studyProgress).forEach(k=>{
    if(/^\d+$/.test(k)){
      const r=studyProgress[k];
      if(r && r.mcPass && r.wrPass && r.wnPass===undefined){ r.wnPass=true; changed=true; }
    }
  });
  if(changed) saveLocal();
}
window.onload=function(){
  applyTheme(); migrateProgress(); loadLastPosition(); enforceSetLock(); createSetOptions(); loadSet();
};
</script>
